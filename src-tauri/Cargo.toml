[package]
name = "tesla-usb-detector"
version = "0.2.1"
description = "TTbox USB Toolkit on Windows and macOS"
authors = ["JiaXiang Huang"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "tesla_usb_detector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Store / Partner Center / Mac App Store builds. Compiles out the GitHub Releases updater.
store-channel = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3.34"
dirs = "7.0.0"
