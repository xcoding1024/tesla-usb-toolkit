[package]
name = "tesla-usb-detector"
version = "0.1.0"
description = "Tesla USB Toolkit for Windows and macOS"
authors = ["JiaXiang Huang"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[lib]
name = "tesla_usb_detector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
