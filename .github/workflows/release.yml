# GitHub Release channel (MSI / NSIS / DMG) with the in-app updater enabled.
# Microsoft Store / Mac App Store packaging is documented in STORE.md and
# optionally built by .github/workflows/store.yml — do not attach store
# configs here or the GitHub updater will be compiled out.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="USB Toolkit for Tesla v${VERSION}"
          NOTES="$(cat <<EOF
          USB Toolkit for Tesla v${VERSION}

          ## Downloads

          - **Windows**: \`.msi\` installer or NSIS \`.exe\` (x64)
          - **macOS**: \`.dmg\` for Apple Silicon (\`aarch64\`) and Intel (\`x86_64\`)

          macOS builds are ad-hoc signed. If Gatekeeper blocks the app, allow it in **Privacy & Security**. Windows SmartScreen may warn because the installer is unsigned.

          ## What's new

          - Check GitHub Releases from Settings and download the matching Windows or macOS installer
          - Scan TeslaCam, Light Show, wraps, and lock chimes
          - Format removable drives as exFAT / FAT32 (and MS-DOS FAT on macOS)
          - System disks are rejected before format

          This project is not affiliated with Tesla, Inc.

          **中文摘要：** v${VERSION} 提供 Windows 安装包与 macOS DMG，并可在设置中检查 GitHub 更新。macOS 为临时签名；若系统提示无法打开，请在「隐私与安全性」中允许。
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          ID="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --repo "${GITHUB_REPOSITORY}"
